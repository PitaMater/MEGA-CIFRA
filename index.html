<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MEGA CIFRA</title>

<style>

/* =========================
   CONFIGURAÇÕES GERAIS
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    background: #020202;
    color: #e8e8e8;
    font-family: "Courier New", monospace;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;

    transition: background 0.2s;
}


/* =========================
   EFEITO CRT
========================= */

body::before {
    content: "";
    position: fixed;
    inset: 0;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,0.025) 0px,
            rgba(255,255,255,0.025) 1px,
            transparent 1px,
            transparent 4px
        );

    pointer-events: none;
    z-index: 100;
}


/* =========================
   VINHETA
========================= */

body::after {
    content: "";

    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            ellipse at center,
            transparent 40%,
            rgba(0,0,0,0.85) 100%
        );

    pointer-events: none;
    z-index: 101;
}


/* =========================
   CAIXA PRINCIPAL
========================= */

.caixa {
    position: relative;

    width: min(850px, 88%);
    min-height: 430px;

    padding: 55px;

    text-align: center;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.035),
            rgba(0,0,0,0.8)
        );

    border: 1px solid #333;

    box-shadow:
        0 0 30px rgba(0,0,0,0.8),
        inset 0 0 40px rgba(255,255,255,0.02);

    animation: entrada 1.2s ease;
}


/* =========================
   CANTOS DA CAIXA
========================= */

.caixa::before,
.caixa::after {
    content: "";

    position: absolute;

    width: 35px;
    height: 35px;

    border-color: #777;
    border-style: solid;
}

.caixa::before {
    top: -1px;
    left: -1px;

    border-width: 2px 0 0 2px;
}

.caixa::after {
    bottom: -1px;
    right: -1px;

    border-width: 0 2px 2px 0;
}


/* =========================
   STATUS
========================= */

.status {
    position: absolute;

    top: 15px;
    left: 20px;

    color: #666;

    font-size: 11px;

    letter-spacing: 2px;
}

.status::before {
    content: "● ";

    color: #777;
}


/* =========================
   TÍTULO
========================= */

h1 {
    margin: 25px 0 5px;

    font-size: clamp(42px, 8vw, 80px);

    letter-spacing: 10px;

    color: #eee;

    text-shadow:
        0 0 5px rgba(255,255,255,0.5),
        0 0 15px rgba(255,255,255,0.1);

    animation: titulo 4s infinite;
}

h2 {
    margin: 0 0 35px;

    color: #777;

    font-size: 14px;

    letter-spacing: 5px;
}


/* =========================
   TEXTO
========================= */

p {
    color: #aaa;

    line-height: 1.8;

    font-size: 15px;
}


/* =========================
   CURSOR
========================= */

.cursor {
    display: inline-block;

    width: 8px;
    height: 15px;

    background: #aaa;

    margin-left: 4px;

    animation: cursor 0.8s infinite;
}


/* =========================
   BOTÃO
========================= */

button {
    margin-top: 25px;

    padding: 14px 35px;

    background: transparent;

    border: 1px solid #777;

    color: #ddd;

    font-family: "Courier New", monospace;

    font-size: 14px;

    letter-spacing: 3px;

    cursor: pointer;

    transition: 0.2s;
}

button:hover {
    background: #ddd;

    color: #000;

    box-shadow:
        0 0 15px rgba(255,255,255,0.3);

    transform: scale(1.04);
}


/* =========================
   NÚMERO DA PERGUNTA
========================= */

.pergunta-numero {
    color: #666;

    font-size: 12px;

    letter-spacing: 3px;

    margin-bottom: 25px;
}


/* =========================
   PERGUNTA
========================= */

.pergunta {
    font-size: 20px;

    color: #ddd;

    margin-bottom: 30px;
}


/* =========================
   INPUT
========================= */

input {
    width: min(500px, 90%);

    padding: 14px;

    background: #050505;

    border: 1px solid #444;

    color: #fff;

    outline: none;

    text-align: center;

    font-family: "Courier New", monospace;

    font-size: 16px;

    transition: 0.2s;
}

input:focus {
    border-color: #aaa;

    box-shadow:
        0 0 15px rgba(255,255,255,0.08);
}


/* =========================
   MENSAGEM
========================= */

#mensagem {
    min-height: 25px;

    margin-top: 20px;

    color: #777;

    font-size: 12px;

    letter-spacing: 2px;
}


/* =========================
   TRANSIÇÃO ENTRE PERGUNTAS
========================= */

.trocando {
    animation: troca 0.5s ease;
}


/* =========================
   FINAL
========================= */

.final {
    animation: finalEntrada 1s ease;
}


/* =========================================================
   🔴 ERRO — ACCESS DENIED
========================================================= */

body.erro {
    animation: erroTela 0.7s;
}

body.erro .caixa {
    animation: erroCaixa 0.7s;
}

body.erro::after {
    content: "ACCESS DENIED";

    position: fixed;

    inset: 0;

    z-index: 9999;

    display: flex;

    align-items: center;
    justify-content: center;

    color: #ff2020;

    background: rgba(255,0,0,0.08);

    font-size: clamp(30px, 7vw, 90px);

    font-weight: bold;

    letter-spacing: 10px;

    text-shadow:
        0 0 5px #ff2020,
        0 0 15px #ff2020,
        0 0 30px #ff2020;

    pointer-events: none;

    animation: erroMensagem 0.7s;
}


/* =========================================================
   🟢 ACERTO — ACCESS PASSED
========================================================= */

body.acerto {
    animation: acertoTela 0.7s;
}

body.acerto .caixa {
    animation: acertoCaixa 0.7s;
}

body.acerto::after {
    content: "ACCESS PASSED";

    position: fixed;

    inset: 0;

    z-index: 9999;

    display: flex;

    align-items: center;
    justify-content: center;

    color: #00ff66;

    background: rgba(0,255,80,0.08);

    font-size: clamp(30px, 7vw, 90px);

    font-weight: bold;

    letter-spacing: 10px;

    text-shadow:
        0 0 5px #00ff66,
        0 0 15px #00ff66,
        0 0 30px #00ff66;

    pointer-events: none;

    animation: acertoMensagem 0.7s;
}


/* =========================
   ANIMAÇÕES
========================= */

@keyframes entrada {

    from {
        opacity: 0;
        transform: scale(0.95);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}


@keyframes titulo {

    0%,
    90%,
    100% {
        transform: translateX(0);
    }

    92% {
        transform: translateX(-2px);
    }

    94% {
        transform: translateX(3px);
    }

    96% {
        transform: translateX(-1px);
    }
}


@keyframes cursor {

    0%,
    50% {
        opacity: 1;
    }

    51%,
    100% {
        opacity: 0;
    }
}


/* =========================
   ERRO VERMELHO
========================= */

@keyframes erroTela {

    0%,
    100% {
        background: #020202;
    }

    15% {
        background: #ff2020;
    }

    30% {
        background: #020202;
    }

    45% {
        background: #ff2020;
    }

    60% {
        background: #020202;
    }

    75% {
        background: #ff2020;
    }
}


@keyframes erroCaixa {

    0%,
    100% {
        transform: translateX(0);
    }

    10% {
        transform: translateX(-12px);
    }

    20% {
        transform: translateX(12px);
    }

    30% {
        transform: translateX(-8px);
    }

    40% {
        transform: translateX(8px);
    }

    50% {
        transform: translateX(-4px);
    }

    60% {
        transform: translateX(4px);
    }
}


@keyframes erroMensagem {

    0% {
        opacity: 0;

        transform:
            scale(0.7)
            skewX(0deg);

        filter: brightness(3);
    }

    10% {
        opacity: 1;

        transform:
            scale(1.1)
            skewX(-10deg);
    }

    20% {
        transform:
            translateX(-20px)
            skewX(10deg);
    }

    30% {
        transform:
            translateX(20px)
            skewX(-10deg);
    }

    40% {
        transform:
            translateX(-10px);
    }

    50% {
        transform:
            translateX(10px);
    }

    70% {
        opacity: 1;

        transform: scale(1);
    }

    100% {
        opacity: 0;
    }
}


/* =========================
   ACERTO VERDE
========================= */

@keyframes acertoTela {

    0%,
    100% {
        background: #020202;
    }

    15% {
        background: #00ff66;
    }

    30% {
        background: #020202;
    }

    45% {
        background: #00ff66;
    }

    60% {
        background: #020202;
    }

    75% {
        background: #00ff66;
    }
}


@keyframes acertoCaixa {

    0%,
    100% {
        transform: scale(1);
    }

    20% {
        transform: scale(1.03);
    }

    40% {
        transform: scale(0.98);
    }

    60% {
        transform: scale(1.02);
    }
}


@keyframes acertoMensagem {

    0% {
        opacity: 0;

        transform: scale(0.7);

        filter: brightness(3);
    }

    15% {
        opacity: 1;

        transform:
            scale(1.1)
            skewX(-5deg);
    }

    30% {
        transform:
            scale(0.95)
            skewX(5deg);
    }

    45% {
        transform:
            scale(1.05)
            skewX(-3deg);
    }

    70% {
        opacity: 1;

        transform: scale(1);
    }

    100% {
        opacity: 0;
    }
}


/* =========================
   TROCA DE PERGUNTA
========================= */

@keyframes troca {

    from {
        opacity: 0;

        transform:
            translateY(15px);
    }

    to {
        opacity: 1;

        transform:
            translateY(0);
    }
}


/* =========================
   FINAL
========================= */

@keyframes finalEntrada {

    from {
        opacity: 0;

        transform:
            scale(0.8);
    }

    to {
        opacity: 1;

        transform:
            scale(1);
    }
}

</style>
</head>


<body>


<div class="caixa" id="conteudo">

    <div class="status">
        SISTEMA ONLINE
    </div>

    <h1>
        MEGA CIFRA
    </h1>

    <h2>
        TRANSMISSÃO RESTRITA
    </h2>

    <p>
        Você foi selecionado.
        <span class="cursor"></span>
    </p>

    <p>
        Sua participação foi registrada.<br>
        O restante depende de você.
    </p>

    <button onclick="iniciar()">
        INICIAR
    </button>

</div>


<script>

/* =========================================================
   ⚠️ EDITE SOMENTE ESTA PARTE
========================================================= */

const perguntas = [

    {
        pergunta: "Qual é a resposta da primeira pergunta?",
        resposta: "minecraft"
    },

    {
        pergunta: "Segunda pergunta vai aqui.",
        resposta: "resposta2"
    },

    {
        pergunta: "Terceira pergunta vai aqui.",
        resposta: "resposta3"
    }

];


/* =========================================================
   NÃO PRECISA EDITAR DAQUI PARA BAIXO
========================================================= */

let perguntaAtual = 0;


/* =========================
   INICIAR
========================= */

function iniciar() {

    perguntaAtual = 0;

    mostrarPergunta();

}


/* =========================
   MOSTRAR PERGUNTA
========================= */

function mostrarPergunta() {

    const p = perguntas[perguntaAtual];

    const caixa =
        document.getElementById("conteudo");


    caixa.classList.remove("trocando");

    void caixa.offsetWidth;

    caixa.classList.add("trocando");


    caixa.innerHTML = `

        <div class="status">
            SISTEMA ONLINE
        </div>

        <div class="pergunta-numero">
            ARQUIVO ${String(perguntaAtual + 1).padStart(2, "0")}
            /
            ${String(perguntas.length).padStart(2, "0")}
        </div>

        <h1>
            MEGA CIFRA
        </h1>

        <p class="pergunta">
            ${p.pergunta}
        </p>

        <input
            id="resposta"
            type="text"
            autocomplete="off"
            spellcheck="false"
        >

        <br>

        <button onclick="verificar()">
            CONFIRMAR
        </button>

        <div id="mensagem"></div>

    `;


    document
        .getElementById("resposta")
        .focus();

}


/* =========================
   VERIFICAR RESPOSTA
========================= */

function verificar() {

    const campo =
        document.getElementById("resposta");

    const resposta =
        campo.value
        .trim()
        .toLowerCase();

    const correta =
        perguntas[perguntaAtual]
        .resposta
        .trim()
        .toLowerCase();


    /* =================================
       🟢 RESPOSTA CERTA
    ================================= */

    if (resposta === correta) {

        document.body.classList.remove("erro");
        document.body.classList.remove("acerto");

        void document.body.offsetWidth;

        document.body.classList.add("acerto");


        setTimeout(() => {

            document.body.classList.remove("acerto");

            perguntaAtual++;


            if (perguntaAtual >= perguntas.length) {

                finalizar();

            } else {

                mostrarPergunta();

            }

        }, 700);


        return;
    }


    /* =================================
       🔴 RESPOSTA ERRADA
    ================================= */

    document.getElementById("mensagem")
        .textContent =
        "RESPOSTA NÃO RECONHECIDA.";


    document.body.classList.remove("erro");

    void document.body.offsetWidth;

    document.body.classList.add("erro");


    setTimeout(() => {

        document.body.classList.remove("erro");

    }, 700);

}


/* =========================
   FINAL
========================= */

function finalizar() {

    const caixa =
        document.getElementById("conteudo");


    caixa.innerHTML = `

        <div class="status">
            SISTEMA ONLINE
        </div>

        <div class="final">

            <h1>
                FIM
            </h1>

            <h2>
                TRANSMISSÃO CONCLUÍDA
            </h2>

            <p>
                Todas as verificações foram concluídas.
            </p>

            <p>
                Você chegou até o fim.
            </p>

            <p>
                <span style="color:#00ff66;">
                    [ ACESSO CONCEDIDO ]
                </span>
            </p>

        </div>

    `;

}


/* =========================
   ENTER = CONFIRMAR
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            document.activeElement &&
            document.activeElement.id === "resposta"
        ) {

            verificar();

        }

    }
);

</script>

</body>
</html>
