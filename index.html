<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #030303;
        color: white;
        font-family: monospace;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 50;

        background: repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,0.035) 0px,
            rgba(255,255,255,0.035) 1px,
            transparent 1px,
            transparent 4px
        );

        opacity: 0.65;
    }

    body::after {
        content: "";
        position: fixed;
        inset: -50%;
        pointer-events: none;
        z-index: 49;

        background-image:
            repeating-radial-gradient(
                circle at 0 0,
                rgba(255,255,255,0.04) 0,
                rgba(255,255,255,0.04) 1px,
                transparent 1px,
                transparent 3px
            );

        opacity: 0.08;
        animation: ruido 0.18s infinite;
    }

    .caixa {
        width: 80%;
        max-width: 700px;
        padding: 45px;
        border: 1px solid #333;
        background: rgba(8,8,8,0.96);
        text-align: center;
        position: relative;

        box-shadow:
            0 0 25px rgba(255,255,255,0.03),
            inset 0 0 30px rgba(255,255,255,0.02);

        animation: aparecer 1s ease;
    }

    .caixa::before,
    .caixa::after {
        content: "";
        position: absolute;
        width: 25px;
        height: 25px;
        border-color: #777;
    }

    .caixa::before {
        top: -1px;
        left: -1px;
        border-top: 1px solid;
        border-left: 1px solid;
    }

    .caixa::after {
        bottom: -1px;
        right: -1px;
        border-bottom: 1px solid;
        border-right: 1px solid;
    }

    h1 {
        font-size: 44px;
        letter-spacing: 10px;
        margin-bottom: 30px;

        text-shadow:
            2px 0 #444,
            -2px 0 #222;

        animation: titulo 3s infinite;
    }

    p {
        color: #aaa;
        font-size: 17px;
        line-height: 1.7;
    }

    .subtitulo {
        color: #555;
        font-size: 12px;
        letter-spacing: 4px;
        margin-top: 25px;
    }

    button {
        margin-top: 28px;
        padding: 14px 38px;

        background: #090909;
        color: #ddd;

        border: 1px solid #555;
        cursor: pointer;

        font-family: monospace;
        letter-spacing: 3px;

        transition:
            background 0.2s,
            border-color 0.2s,
            box-shadow 0.2s,
            transform 0.2s;
    }

    button:hover {
        background: #181818;
        border-color: #aaa;

        box-shadow:
            0 0 15px rgba(255,255,255,0.08);

        transform: scale(1.04);
    }

    button:active {
        transform: scale(0.97);
    }

    input {
        margin-top: 20px;
        padding: 13px;

        width: 75%;

        background: #050505;
        color: white;

        border: 1px solid #555;

        font-family: monospace;
        text-align: center;

        outline: none;
    }

    input:focus {
        border-color: #aaa;

        box-shadow:
            0 0 12px rgba(255,255,255,0.06);
    }

    #mensagem {
        margin-top: 20px;
        color: #777;
        min-height: 20px;
    }

    /* ==========================
       EFEITO DE ERRO
       ========================== */

    body.erro {
        animation: telaErro 0.55s steps(2);
    }

    body.erro .caixa {
        animation: caixaErro 0.45s steps(3);
    }

    body.erro::after {
        content: "ACCESS DENIED";

        position: fixed;
        inset: 0;

        display: flex;
        justify-content: center;
        align-items: center;

        color: #ff2222;

        font-size: 36px;
        font-weight: bold;
        letter-spacing: 9px;

        background:
            repeating-linear-gradient(
                to bottom,
                rgba(255,0,0,0.08) 0px,
                rgba(255,0,0,0.08) 2px,
                transparent 2px,
                transparent 6px
            );

        z-index: 100;
        pointer-events: none;

        text-shadow:
            4px 0 #550000,
            -4px 0 #220000;

        animation: mensagemErro 0.55s steps(4);
    }

    /* ==========================
       ANIMAÇÕES
       ========================== */

    @keyframes aparecer {
        from {
            opacity: 0;
            transform: scale(0.96);
        }

        to {
            opacity: 1;
            transform: scale(1);
        }
    }

    @keyframes titulo {
        0%, 90%, 100% {
            opacity: 1;
            transform: translateX(0);
        }

        92% {
            opacity: 0.7;
            transform: translateX(-2px);
        }

        94% {
            opacity: 1;
            transform: translateX(3px);
        }
    }

    @keyframes ruido {
        0% {
            transform: translate(0,0);
        }

        25% {
            transform: translate(3%, -2%);
        }

        50% {
            transform: translate(-2%, 3%);
        }

        75% {
            transform: translate(2%, 1%);
        }

        100% {
            transform: translate(0,0);
        }
    }

    @keyframes telaErro {
        0% {
            background: #030303;
            transform: translate(0);
        }

        15% {
            background: #650000;
            transform: translate(-5px, 2px);
        }

        30% {
            background: #100000;
            transform: translate(6px, -2px);
        }

        45% {
            background: #800000;
            transform: translate(-3px, 1px);
        }

        60% {
            background: #050000;
            transform: translate(4px, 0);
        }

        75% {
            background: #420000;
            transform: translate(-2px, -1px);
        }

        100% {
            background: #030303;
            transform: translate(0);
        }
    }

    @keyframes caixaErro {
        0% {
            transform: translate(0);
        }

        20% {
            transform: translate(-10px, 2px);
        }

        40% {
            transform: translate(8px, -2px);
        }

        60% {
            transform: translate(-5px, 1px);
        }

        80% {
            transform: translate(4px, 0);
        }

        100% {
            transform: translate(0);
        }
    }

    @keyframes mensagemErro {
        0% {
            opacity: 0;
            transform: translateX(0);
        }

        15% {
            opacity: 1;
            transform: translateX(-12px);
        }

        30% {
            opacity: 0.3;
            transform: translateX(10px);
        }

        45% {
            opacity: 1;
            transform: translateX(-7px);
        }

        65% {
            opacity: 0.6;
            transform: translateX(5px);
        }

        100% {
            opacity: 0;
            transform: translateX(0);
        }
    }
</style>

<div class="caixa" id="conteudo">

    <h1>MEGA CIFRA</h1>

    <p>Você foi selecionado.</p>

    <p>O desafio começará em breve...</p>

    <div class="subtitulo">
        [ SISTEMA ONLINE ]
    </div>

    <button onclick="iniciar()">
        INICIAR
    </button>

</div>


<script>

    /* ==================================================
       PERGUNTAS DO DESAFIO

       MUDE SOMENTE ESTA PARTE!

       "pergunta" = o que a pessoa verá
       "resposta" = resposta correta
       ================================================== */

    const perguntas = [

        {
            pergunta: "Qual é a resposta da primeira pergunta?",
            resposta: "minecraft"
        },

        {
            pergunta: "Segunda pergunta vai aqui.",
            resposta: "resposta2"
        },

        {
            pergunta: "Terceira pergunta vai aqui.",
            resposta: "resposta3"
        }

    ];


    /* ==================================================
       SISTEMA DO DESAFIO
       NÃO PRECISA MEXER DAQUI PARA BAIXO
       ================================================== */

    let perguntaAtual = 0;


    function iniciar() {
        mostrarPergunta();
    }


    function mostrarPergunta() {

        const p = perguntas[perguntaAtual];

        document.getElementById("conteudo").innerHTML = `

            <h1>MEGA CIFRA</h1>

            <p>${p.pergunta}</p>

            <input
                type="text"
                id="resposta"
                placeholder="Digite sua resposta..."
                autocomplete="off"
            >

            <br>

            <button onclick="verificar()">
                RESPONDER
            </button>

            <div id="mensagem"></div>

        `;

        document.getElementById("resposta").focus();
    }


    function verificar() {

        const resposta = document
            .getElementById("resposta")
            .value
            .trim()
            .toLowerCase();

        const correta = perguntas[perguntaAtual]
            .resposta
            .trim()
            .toLowerCase();


        if (resposta === correta) {

            perguntaAtual++;

            if (perguntaAtual >= perguntas.length) {

                document.getElementById("conteudo").innerHTML = `

                    <h1>FIM</h1>

                    <p>
                        Você completou o desafio.
                    </p>

                    <div class="subtitulo">
                        [ TRANSMISSÃO ENCERRADA ]
                    </div>

                `;

            } else {

                mostrarPergunta();

            }

        } else {

            document.getElementById("mensagem").textContent =
                "RESPOSTA INCORRETA.";

            document.body.classList.remove("erro");

            void document.body.offsetWidth;

            document.body.classList.add("erro");

            setTimeout(() => {

                document.body.classList.remove("erro");

            }, 600);

        }
    }


    /* ENTER também envia a resposta */

    document.addEventListener("keydown", function(event) {

        if (
            event.key === "Enter" &&
            document.activeElement &&
            document.activeElement.id === "resposta"
        ) {

            verificar();

        }

    });

</script>
