<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEGA CIFRA</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #050505;
            color: white;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .caixa {
            width: 80%;
            max-width: 700px;
            padding: 40px;
            border: 1px solid #333;
            background: #0b0b0b;
            text-align: center;
        }

        h1 {
            font-size: 42px;
            letter-spacing: 8px;
        }

        p {
            color: #aaa;
            font-size: 17px;
        }

        button {
            margin-top: 25px;
            padding: 12px 30px;
            background: #111;
            color: white;
            border: 1px solid #555;
            cursor: pointer;
            font-family: monospace;
        }

        button:hover {
            background: #222;
        }
    </style>
</head>

<body>

    <div class="caixa">
        <h1>MEGA CIFRA</h1>

        <p>Você foi selecionado.</p>

        <p>O desafio começará em breve...</p>

        <button onclick="alert('O desafio ainda não começou.')">
            INICIAR
        </button>
    </div>

</body>
</html>
